services:
  spring-app:
    image: ghcr.io/dba-second-team/iseonjwa-be:${BE_TAG:-latest}
    env_file: .env
    expose:
      - "8080"
    restart: unless-stopped

  nginx:
    image: ghcr.io/dba-second-team/iseonjwa-be:${FE_TAG:-latest}
    ports:
      - "80:80"
    depends_on:
      - spring-app
    restart: unless-stopped