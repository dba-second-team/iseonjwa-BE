springdoc:
  swagger-ui:
    tags-sorter: alpha
    operations-sorter: method

spring:
  application:
    name: iseonjwa
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/iseonjwa}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

queue:
  active:
    max-size: ${QUEUE_ACTIVE_MAX_SIZE:4}
    ttl-seconds: ${QUEUE_ACTIVE_TTL_SECONDS:600}
